name: Check package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check dashboard/static/app.js
      - run: node --check dashboard/static/settings.js && node --check dashboard/static/login.js && node --check dashboard/static/appearance.js
      - run: bash -n unraid/collector.sh && bash -n unraid/start.sh && bash -n unraid/stop.sh
      - run: sh -n deploy/install-collector.sh
      - run: docker build -t observatory:test .
      - name: Container health and authentication
        run: |
          mkdir -p .secrets
          python deploy/setup-secrets.py
          docker compose up -d --wait
          curl --fail http://127.0.0.1:9106/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9106/api/current)" = 401
          docker compose down
      - name: Dockhand Git stack health and authentication
        env:
          OBSERVATORY_DATA_VOLUME: observatory-dockhand-ci
        run: |
          export OBSERVATORY_SECRETS_DIR="$PWD/.secrets"
          docker volume create "$OBSERVATORY_DATA_VOLUME"
          docker compose -p observatory-dockhand-ci -f compose.dockhand.yaml config --quiet
          docker compose -p observatory-dockhand-ci -f compose.dockhand.yaml up -d --build --wait
          curl --fail http://127.0.0.1:9106/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9106/api/current)" = 401
          docker compose -p observatory-dockhand-ci -f compose.dockhand.yaml down
          docker volume inspect "$OBSERVATORY_DATA_VOLUME" >/dev/null
          docker volume rm "$OBSERVATORY_DATA_VOLUME"
