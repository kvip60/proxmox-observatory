name: Check package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check dashboard/static/app.js
      - run: sh -n deploy/install-collector.sh
      - run: docker build -t observatory:test .
      - name: Container health and authentication
        run: |
          mkdir -p .secrets
          python deploy/setup-secrets.py
          docker compose up -d --wait
          curl --fail http://127.0.0.1:9106/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9106/api/current)" = 401
          docker compose down
